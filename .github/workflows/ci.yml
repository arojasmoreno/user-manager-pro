name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      # Sólo hace falta la copia de trabajo: gitleaks escanea el árbol, no el
      # historial (que aún contiene una clave filtrada que se purga aparte).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detector propio (sin dependencias)
        run: node scripts/scan-secrets.mjs

      - name: Instalar gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: gitleaks
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose
