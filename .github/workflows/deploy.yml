name: Deploy

# Publica `dist/` en Cloudflare Workers. Ojo con el alcance: la URL de
# producción del proyecto, `docmanager.freebuff.app`, la sirve la plataforma
# (los despliegues que hay registrados para ella los publica `freebuff-web`),
# no este workflow; publicar aquí deja la app en la URL del worker. Son dos
# hosts distintos de la misma build, y este es el que controla el repositorio.

on:
  push:
    branches: [main]
  # Permite republicar sin necesidad de un push nuevo (por ejemplo, tras rotar
  # un secreto o tras un fallo transitorio del proveedor).
  workflow_dispatch:

# Un despliegue a la vez por rama: si llegan dos pushes seguidos, el segundo
# cancela al primero en lugar de publicar dos veces compitiendo.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # El cliente de Convex lee esta variable en tiempo de build. Sin ella Vite
      # compila igual y el despliegue sale en verde, pero la app publicada no
      # conecta con el backend: mejor fallar aquí que publicar eso.
      - name: Comprobar VITE_CONVEX_URL
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: |
          if [ -z "${VITE_CONVEX_URL}" ]; then
            echo "::error::Falta el secreto VITE_CONVEX_URL. Añádelo en Settings → Secrets and variables → Actions con el valor de VITE_CONVEX_URL de tu .env.local."
            exit 1
          fi

      # Sin estas dos credenciales el paso de publicación fallaría más adelante
      # con un error opaco del CLI. Se comprueban aquí, antes del build, para
      # que el run diga exactamente qué falta.
      - name: Comprobar credenciales de Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "${CLOUDFLARE_API_TOKEN}" ] && missing="${missing} CLOUDFLARE_API_TOKEN"
          [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] && missing="${missing} CLOUDFLARE_ACCOUNT_ID"
          if [ -n "${missing}" ]; then
            echo "::error::Faltan estos secretos de Actions:${missing}. Añádelos en Settings → Secrets and variables → Actions para que este workflow pueda publicar en Cloudflare."
            exit 1
          fi

      # Construir, publicar y verificar en un solo paso: el mismo script que se
      # usa en local (`bun run deploy`), para que lo que funciona en tu máquina
      # sea exactamente lo que corre aquí. Publica `dist/` como Worker
      # sólo-con-assets (la configuración vive en wrangler.jsonc) y después
      # comprueba la URL publicada: el fallback del SPA respondería 200 aunque no
      # se sirviera un solo asset, así que un despliegue en verde, por sí solo, no
      # probaría nada.
      - name: Construir, publicar y verificar
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
